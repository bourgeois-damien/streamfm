program: experiments/benchmarks/sweeps/run_benchmark_sweep.py
project: streamfm-benchmark-sweeps
entity: damien-brgs92-heriot-watt-university
method: grid
parameters:
  backend:
    value: modal
  task:
    value: stftpr
  part:
    value: model
  pipeline:
    value: audio
  execution:
    values:
      - eager
      - compiled
      - cuda_graph
  steps:
    value: 1
  dtype:
    values:
      - fp32
      - fp16
      - bf16
  memory_format:
    values:
      - contiguous
      - channels_last
  preallocate_model_buffers:
    values:
      - false
      - true
  iterations:
    value: 100
  warmup:
    value: 20
  hardware:
    value: L4

# preallocate useless with cuda_graph
exclude:
  - execution: cuda_graph
    preallocate_model_buffers: true
